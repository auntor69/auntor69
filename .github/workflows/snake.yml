name: Generate contribution snake

on:
  schedule:
    # daily, off the hour to avoid the cron rush
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate the snake SVG from the contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: auntor69
          outputs: |
            dist/snake-dark.svg?palette=github-dark

      - name: Publish it to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
